name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.15'
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q watchdog.py
      - run: cp .env.example .env && cp jobs.example.json jobs.json && docker compose config -q
